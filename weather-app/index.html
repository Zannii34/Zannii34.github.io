<!-- index.html -->

<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Smart Weather App</title>

  <!-- CSS -->
  <link rel="stylesheet" href="styles.css">

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

</head>

<body>

  <div class="container">

    <div class="weather-card">

      <h1>Smart Weather App</h1>

      <!-- Search Box -->
      <div class="search-box">

        <input
          type="text"
          id="cityInput"
          placeholder="Search suburb or city..."
        >

        <button id="searchBtn">
          <i class="fas fa-search"></i>
        </button>

      </div>

      <!-- Weather Info -->
      <div class="weather-info">

        <!-- Weather Icon -->
        <img
          id="weatherIcon"
          src="https://openweathermap.org/img/wn/01d@2x.png"
          alt="Weather Icon"
        >

        <!-- Area/Suburb Name -->
        <h2 id="cityName">Loading...</h2>

        <!-- Temperature -->
        <div class="temp">
          <span id="temperature">0</span>°C
        </div>

        <!-- Description -->
        <p id="description">
          Weather Description
        </p>

        <!-- Weather Details -->
        <div class="details">

          <!-- Humidity -->
          <div class="detail-box">

            <i class="fas fa-water"></i>

            <div>

              <p>Humidity</p>

              <span id="humidity">
                0%
              </span>

            </div>

          </div>

          <!-- Wind Speed -->
          <div class="detail-box">

            <i class="fas fa-wind"></i>

            <div>

              <p>Wind Speed</p>

              <span id="wind">
                0 km/h
              </span>

            </div>

          </div>

        </div>

        <!-- Hourly Forecast -->
        <div class="hourly-section">

          <h3>
            Upcoming Hourly Forecast
          </h3>

          <div
            id="hourlyForecast"
            class="hourly-container"
          >

          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>

</body>
</html>
