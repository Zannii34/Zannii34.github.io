<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Pokémon Explorer &amp; Team Builder</title><link href="styles.css" rel="stylesheet"/></head><body><main><a class="back" href="../../">← Portfolio</a><section class="app"><header><div><small>POKÉAPI DEMO</small><h1>Pokémon Explorer</h1><p>Search, filter, sort and build a six-Pokémon team.</p></div><div class="team-count"><span id="count">0</span>/6 Team</div></header><section class="controls"><input aria-label="Search Pokémon by name or ID" id="search" placeholder="Search by name or ID..."/><select aria-label="Filter Pokémon by type" id="type"><option value="">All types</option><option>fire</option><option>water</option><option>grass</option><option>electric</option><option>psychic</option><option>bug</option><option>normal</option><option>poison</option><option>ground</option><option>flying</option><option>rock</option><option>ghost</option><option>dragon</option><option>ice</option><option>fighting</option></select><select aria-label="Sort Pokémon" id="sort"><option value="id">Number</option><option value="name">Name</option></select><button id="random" type="button">Random Pokémon</button><button id="clearTeam" type="button">Clear Team</button></section><p aria-live="polite" id="status">Loading Pokémon…</p><section><h2>My Team</h2><div class="team" id="team"></div></section><section><h2>Pokémon</h2><div class="grid" id="grid"></div></section></section></main><script src="script.js"></script></body></html>
