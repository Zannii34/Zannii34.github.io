<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>To-Do Application</title><link rel="stylesheet" href="style.css"></head><body><main><a class="back" href="../../">← Portfolio</a><section class="app"><header><small>PRODUCTIVITY DEMO</small><h1>Task Manager</h1><p>Tasks are saved locally in your browser.</p></header><form id="taskForm"><input id="task" required placeholder="What needs to be done?"><select id="category"><option>Work</option><option>Personal</option><option>Learning</option></select><select id="priority"><option>Normal</option><option>High</option><option>Low</option></select><input id="due" type="date" aria-label="Due date"><button>Add Task</button></form><div class="tools"><input id="filter" placeholder="Search tasks..."><select id="status"><option value="all">All tasks</option><option value="active">Active</option><option value="done">Completed</option></select><button id="clearDone">Clear completed</button></div><div class="summary" id="summary"></div><ul id="list"></ul></section></main><script src="script.js"></script></body></html>
