<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced ToDo App</title>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="container">

    <!-- Top Bar -->
    <div class="top-bar">
      <h1>📝 ToDo App</h1>
      <button id="themeBtn">
        <i class="fa-solid fa-moon"></i>
      </button>
    </div>

    <!-- Search -->
    <input
      type="text"
      id="searchInput"
      placeholder="🔍 Search tasks..."
    >

    <!-- Task Statistics -->
    <div class="task-stats">
      <p>Total: <span id="totalTasks">0</span></p>
      <p>Completed: <span id="completedTasks">0</span></p>
      <p>Remaining: <span id="remainingTasks">0</span></p>
    </div>

    <!-- Filters -->
    <div class="filters">
      <button id="allBtn">All</button>
      <button id="completedBtn">Completed</button>
      <button id="pendingBtn">Pending</button>
    </div>

    <!-- Input Section -->
    <div class="input-section">

      <input type="text" id="taskInput" placeholder="Enter a task...">

      <select id="category">
        <option value="Work">💼 Work</option>
        <option value="School">📚 School</option>
        <option value="Personal">🏠 Personal</option>
      </select>

      <input type="date" id="dueDate">

      <button id="addBtn">Add</button>

    </div>

    <!-- Task List -->
    <ul id="taskList"></ul>

  </div>

  <script src="script.js"></script>

</body>
</html>
